name: Publish to GitHub Pages
# Builds a static, server-free copy of the app. Demo data by default;
# set the repository variable RADAR_PAGES_MODE=live to publish real NIFTY 50 data.
on:
  push:
    branches: [main]
  schedule:
    - cron: "45 11 * * 1-5"   # 17:15 IST, after the NSE close
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Export data
        run: |
          if [ "${{ vars.RADAR_PAGES_MODE }}" = "live" ]; then
            python -m radar fetch && python -m radar export-static --live
          else
            python -m radar export-static
          fi
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm ci && npm run build:static -- --outDir dist-static
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist-static }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
